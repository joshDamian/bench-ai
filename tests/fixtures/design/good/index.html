<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/app.css"></head>
<body>
  <h1>A page that behaves</h1>
  <p class="muted">Grey, but not too grey, on white or on midnight.</p>
  <div><button>Save</button></div>
  <p><a href="/elsewhere">Somewhere else</a></p>
  <p><span class="tag">Waiting on you</span></p>
  <div class="box"><textarea aria-label="Message"></textarea></div>
  <p class="clamp">A row title that is far too long for the column <span class="muted">and the note that follows it</span></p>
  <p class="dim">Shown at a little less than full, and still readable.</p>
  <button disabled>Save</button>
</body></html>
