# The Xcode project is generated from this file: `brew install xcodegen && xcodegen`,
# then open Bench.xcodeproj. The generated project is not committed.
name: Bench
options:
  bundleIdPrefix: ai.bench
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Bench:
    type: application
    platform: macOS
    sources:
      - path: Bench
    dependencies:
      - package: MarkdownUI
    entitlements:
      path: Bench/Bench.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
    info:
      path: Bench/Info.plist
      properties:
        CFBundleDisplayName: Bench
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Bench
        # Opening a session in Terminal or iTerm runs `claude --resume` there.
        NSAppleEventsUsageDescription: Bench opens sessions in your terminal with claude --resume.
        # A server on a tailnet IP or the LAN may be plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.bench.app
            CFBundleURLSchemes: [bench]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.bench.app
        PRODUCT_NAME: Bench
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  BenchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [BenchTests]
    dependencies:
      - target: Bench
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Bench.app/Contents/MacOS/Bench

schemes:
  Bench:
    build:
      targets:
        Bench: all
        BenchTests: [test]
    test:
      targets: [BenchTests]
