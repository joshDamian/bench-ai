name: Go server

# Builds bench-go, runs its tests, and runs the conformance scenario on the fake Claude CLI,
# compared with the recorded answers. Node runs the scenario and the tests' references.
on:
  push:
    branches: [main]
    paths: ['server-go/**', 'package.json', 'package-lock.json', '.github/workflows/server-go.yml']
  pull_request:
    paths: ['server-go/**', 'package.json', 'package-lock.json', '.github/workflows/server-go.yml']
  workflow_dispatch:

concurrency:
  group: server-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: server-go
        run: go vet ./... && go build -o bin/bench-go ./cmd/bench-go
      - name: Test
        working-directory: server-go
        run: go test ./...
      - name: Conformance
        run: |
          git config --global user.email ci@bench
          git config --global user.name CI
          node server-go/conformance/run.mjs
