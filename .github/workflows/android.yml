name: Android

# Builds the Android client on every change to it, and publishes the APK as a release
# when an `android-v*` tag is pushed (e.g. android-v0.1.0).
on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['apps/android/**', 'apps/tokens.mjs', 'web/app.css', 'web/themes.css', 'web/theme.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'apps/tokens.mjs', 'web/app.css', 'web/themes.css', 'web/theme.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Themes match the stylesheet
        working-directory: .
        run: node apps/tokens.mjs --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/android-v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # The release keystore, when the repo has one, so updates install over each other.
      # Without it the APK is signed with a throwaway debug key.
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bench.jks"
            echo "BENCH_KEYSTORE=$RUNNER_TEMP/bench.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          BENCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BENCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BENCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -PbenchVersion=${{ steps.v.outputs.name }} -PbenchCode=${{ steps.v.outputs.code }} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Compiler and test failures as annotations, so they show on the PR's Files tab.
      - name: Report failures
        if: failure()
        run: |
          grep -E '^e: |error:|FAILED|What went wrong' -A3 "$RUNNER_TEMP/gradle.log" | head -120 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "bench-android-${{ steps.v.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-android
          path: apps/android/bench-android-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bench for Android ${{ steps.v.outputs.name }}
          files: apps/android/bench-android-*.apk
          generate_release_notes: true
