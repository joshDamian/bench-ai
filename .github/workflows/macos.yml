name: macOS

# Builds and tests the Mac client on every change to it, and publishes Bench.dmg as a
# release when a `macos-v*` tag is pushed (e.g. macos-v0.1.0).
#
# Signing: with no secrets the app is ad-hoc signed, and Gatekeeper asks once - right-click
# Bench.app → Open, or `xattr -dr com.apple.quarantine /Applications/Bench.app`. With an
# Apple Developer ID the release is signed and notarized and opens cleanly anywhere. Set:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   the Developer ID Application certificate
#   MACOS_TEAM_ID                                your team id
#   APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8_BASE64   an App Store Connect API key
on:
  push:
    branches: [main]
    tags: ['macos-v*']
    paths: ['apps/macos/**', 'apps/tokens.mjs', 'web/app.css', 'web/themes.css', 'web/theme.mjs', '.github/workflows/macos.yml']
  pull_request:
    paths: ['apps/macos/**', 'apps/tokens.mjs', 'web/app.css', 'web/themes.css', 'web/theme.mjs', '.github/workflows/macos.yml']
  workflow_dispatch:
    inputs:
      hosted:
        description: Build on GitHub's Macs instead of the bench-mac runner
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Josh's Mac (a self-hosted runner labelled bench-mac) builds by default; a manual run
    # can choose GitHub's Macs when it's asleep.
    runs-on: ${{ inputs.hosted && 'macos-26' || fromJSON('["self-hosted","bench-mac"]') }}
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v5

      # A self-hosted Mac uses the Node it has; downloading one there can stall.
      - uses: actions/setup-node@v5
        if: runner.environment == 'github-hosted'
        with:
          node-version: 22
      - name: Themes match the stylesheet
        working-directory: .
        run: node apps/tokens.mjs --check

      - name: Xcode
        run: |
          # GitHub's Macs carry several Xcodes; a self-hosted Mac uses the one already selected.
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Generate the project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodegen generate

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/macos-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/macos-v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The tests launch a copy of Bench as their host. On Josh's Mac that copy competes with
      # the Bench he's using and hangs, so they run on GitHub's Macs only.
      - name: Test
        if: runner.environment == 'github-hosted'
        run: |
          set -o pipefail
          xcodebuild test -project Bench.xcodeproj -scheme Bench -destination 'platform=macOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/test.log" | xcbeautify --renderer github-actions

      - name: Signing identity
        id: sign
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "identity=Developer ID Application" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Bench.xcodeproj -scheme Bench -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" -destination 'generic/platform=macOS' \
            MARKETING_VERSION=${{ steps.v.outputs.name }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="${{ steps.sign.outputs.identity }}" DEVELOPMENT_TEAM="${{ secrets.MACOS_TEAM_ID }}" \
            -skipPackagePluginValidation -skipMacroValidation \
            OTHER_CODE_SIGN_FLAGS="--timestamp" build 2>&1 | tee "$RUNNER_TEMP/build.log" | xcbeautify --renderer github-actions
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release/Bench.app" .

      - name: Why the build failed
        if: failure()
        run: |
          cat "$RUNNER_TEMP"/test.log "$RUNNER_TEMP"/build.log 2>/dev/null | grep -E "error:|error -|\*\* .* FAILED|Command .* failed" | sort -u | head -30 | while IFS= read -r l; do echo "::error::${l:0:400}"; done

      # On Josh's Mac the build is already where it's used: put it in /Applications, with no
      # download for Chrome or Gatekeeper to stop. A running Bench keeps going; reopen it for this one.
      - name: Install on this Mac
        if: runner.environment == 'self-hosted'
        run: |
          dest=/Applications/Bench.app
          rm -rf "$dest.new"
          rm -rf "$dest" 2>/dev/null || true
          # macOS's App Management protection can stop the runner changing apps in
          # /Applications. Say so, rather than leaving a half-replaced app behind.
          if [ -e "$dest" ]; then
            echo "::error::macOS wouldn't let the runner replace $dest. Allow it in System Settings > Privacy & Security > App Management (add the runner's Runner.Listener, or the Terminal it runs in), then re-run."
            exit 1
          fi
          ditto Bench.app "$dest"
          xattr -dr com.apple.quarantine "$dest" || true
          osascript -e 'display notification "Reopen Bench to use it." with title "New Bench build installed"' || true

      - name: Disk image
        run: |
          mkdir dmg && cp -R Bench.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Bench -srcfolder dmg -ov -format UDZO "Bench-${{ steps.v.outputs.name }}.dmg"

      - name: Notarize
        if: steps.sign.outputs.identity != '-'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$KEY_P8" | base64 -d > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "Bench-${{ steps.v.outputs.name }}.dmg" --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple "Bench-${{ steps.v.outputs.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-macos
          path: apps/macos/Bench-*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bench for Mac ${{ steps.v.outputs.name }}
          files: apps/macos/Bench-*.dmg
          generate_release_notes: true
          body: |
            ${{ steps.sign.outputs.identity == '-' && 'This build is not notarized. On first launch, right-click Bench.app and choose Open, or run `xattr -dr com.apple.quarantine /Applications/Bench.app`.' || '' }}
